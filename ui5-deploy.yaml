# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zfitcibilling
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: BTP_DEV_Dev080
          url: https://my440881.s4hana.cloud.sap
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZFI_TCI_BILLING
          description: Fiori App for TCI Billing
          package: ZFI_XOHEA
          transport: HSQK900263
        exclude:
          - /test/
          - /localService/
